name: 自动更新源

on:
  schedule:
    # 每 6 小时轮询一次上游：这是"监听上游变更"的实现方式——
    # 定期比对上游，只有内容发生变化才会产生新提交，无变化则静默跳过。
    - cron: "0 */6 * * *"
  workflow_dispatch: {}          # 支持在 Actions 页面手动触发
  push:
    paths:
      - "upstream.txt"
      - "scripts/update.py"

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行更新脚本
        run: python scripts/update.py

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::上游无变化，跳过提交"
          else
            git commit -m "chore: 自动更新源 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
